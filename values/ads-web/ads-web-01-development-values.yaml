      - name: NUXT_TOOL_URL_01 # Kibana
        value: "https://kibana-soc.rtarf-prod.its-software-services.com/"

      - name: NUXT_TOOL_URL_02 # Kafka
        value: "https://kafka-ui.rtarf-prod.its-software-services.com/"

      - name: NUXT_TOOL_URL_03_1 # Metalog #1
        value: "https://10.141.98.153/"

      - name: NUXT_TOOL_URL_03_2 # Metalog #2
        value: "https://10.141.98.154/"

      - name: NUXT_TOOL_URL_03_3 # Metalog #3
