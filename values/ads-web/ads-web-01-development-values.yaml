ads-web:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 200m
        memory: 200Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: HTTP_PORT
        value: "3000"

      - name: NUXT_PUBLIC_GEO_IP_URL
        value: "https://www.napbiotec.io/"

      - name: NUXT_PUBLIC_MACHINE_STATUS_URL
        value: "https://aldamex.com/"

      - name: NUXT_KEYCLOAK_IDP_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: idp-secret
            key: IDP_CLIENT_ID

      - name: NUXT_KEYCLOAK_IDP_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: idp-secret
            key: IDP_CLIENT_SECRET

      - name: NUXT_KEYCLOAK_IDP_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: idp-secret
            key: IDP_ENDPOINT

      - name: NUXT_API_PATH
        value: "https://api-dev.please-scan.com"

      # Dashboard
      - name: NUXT_DASHBOARD_URL_01 # Zeek Event Summary
        value: "https://superset.rtarf-prod.its-software-services.com/superset/dashboard/p/qDKmB5Nl0vw/"

      - name: NUXT_DASHBOARD_URL_02 # Blacklist Summary
        value: "https://superset.rtarf-prod.its-software-services.com/superset/dashboard/p/yYwmEVAgxnJ/"

      - name: NUXT_DASHBOARD_URL_03 # Crowdstrie Summary
        value: "https://superset.rtarf-prod.its-software-services.com/superset/dashboard/p/7YKg12bR0Ze/"

      - name: NUXT_DASHBOARD_URL_04 # IoC Summary
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

      - name: NUXT_DASHBOARD_URL_05 # Zeek Summary (Suricata)
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

      - name: NUXT_DASHBOARD_URL_06 # Zeek Summary (Intel)
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

      - name: NUXT_DASHBOARD_URL_07 # Zeek Summary (HTTP)
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

      - name: NUXT_DASHBOARD_URL_08 # Zeek Summary (Files)
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

      - name: NUXT_DASHBOARD_URL_09 # Zeek Summary (SSL)
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

      - name: NUXT_DASHBOARD_URL_10 # Zeek Summary (DNS)
        value: "https://www.youtube.com/watch?v=_e3LyCL2F0g"

