ads-web:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 200m
        memory: 200Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: HTTP_PORT
        value: "3000"

      - name: NUXT_PUBLIC_MONITORING_WEB_URL
        value: "https://www.napbiotec.io/"

      - name: NUXT_PUBLIC_GEO_IP_URL
        value: "https://www.napbiotec.io/"

      - name: NUXT_PUBLIC_MACHINE_STATUS_URL
        value: "https://aldamex.com/"

      - name: NUXT_KEYCLOAK_IDP_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: idp-secret
            key: IDP_CLIENT_ID

      - name: NUXT_KEYCLOAK_IDP_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: idp-secret
            key: IDP_CLIENT_SECRET

      - name: NUXT_KEYCLOAK_IDP_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: idp-secret
            key: IDP_ENDPOINT

      - name: NUXT_API_PATH
        value: "https://api-dev.please-scan.com"

      # Commander
      - name: NUXT_PUBLIC_COMMANDER_URL01
        value: "https://will-change-here.com"

