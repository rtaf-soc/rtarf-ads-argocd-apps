
ads-analytic-web:
  enabled: true
  nameOverride: ads-analytic-web

  ingress:
    enabled: false

  podDisruptionBudget:
    enabled: false

  pods:
    controller: deployment

    image:
      name: asia-southeast1-docker.pkg.dev/its-artifact-commons/rtarf/ads-analytic-web

  service:
    enabled: true
    ports:
      - port: 5173
        targetPort: 5173
        protocol: TCP
        name: http
