ads-analytic-web:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 150m
        memory: 256Mi

    env:
      - name: HTTP_PORT
        value: "80"

      - name: API_PATH
        value: "https://defnex-api.please-scan.com"

      - name: API_KEY
        value: "will move this to secret"

      - name: API_AUTHEN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ads-api-secret
            key: API_AUTHEN_PASSWORD
