{{ if eq .Values.envAlias "prod" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ads-clusterrole-binding
subjects:
- kind: ServiceAccount
  name: ads-sa
  namespace: ads-prod
roleRef:
  kind: ClusterRole
  name: ads-clusterrole
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
