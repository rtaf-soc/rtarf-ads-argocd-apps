apiVersion: batch/v1
kind: CronJob
metadata:
  name: thehive-cases-loader
spec:
  # kubectl create job --from=cronjob/thehive-cases-loader thehive-cases-loader-001 -n ads-prod
  suspend: {{ .Values.theHiveLoaderSuspend }}
  schedule: "0 */1 * * *" # Every 1 hours
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          containers:
          - name: cron-script
            image: asia-southeast1-docker.pkg.dev/its-artifact-commons/rtarf/ads-jobs:{{ .Values.adsJob.imageTag }}
            imagePullPolicy: IfNotPresent
            command:
            - ruby
            args:
            - /scripts/thehive-cases-loader.rb
            env:
            #- name: REDIS_HOST
            #  value: redis-master

            #- name: REDIS_PORT
            #  value: "6379"

            #- name: REDIS_PASSWORD
            #  value: "anything-notuse"

            #- name: AGGR_TYPE_NETWORK
            #  value: aggr_network_v3

            #- name: API_AUTHEN_USER
            #  valueFrom:
            #    secretKeyRef:
            #      name: ads-api-secret
            #      key: API_AUTHEN_USER

            #- name: API_AUTHEN_PASSWORD
            #  valueFrom:
            #    secretKeyRef:
            #      name: ads-api-secret
            #      key: API_AUTHEN_PASSWORD

            #- name: API_ENDPOINT
            #  valueFrom:
            #    secretKeyRef:
            #      name: ads-api-secret
            #      key: API_ENDPOINT

            - name: PG_HOST
              value: "postgresql-ads"

            - name: PG_DB
              value: "ads"

            - name: PG_USER
              value: "postgres"

            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ads-postgres-secret
                  key: adminPasswordKey
                  optional: false

            - name: HIVE_HOST
              value: "10.141.98.47:9000"

            - name: HIVE_CASE_COUNT
              value: "3000"

            - name: HIVE_USER
              valueFrom:
                secretKeyRef:
                  name: ads-api-secret
                  key: HIVE_USER
                  optional: false

            - name: HIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ads-api-secret
                  key: HIVE_PASSWORD
                  optional: false

            volumeMounts:
            - name: temp-dir
              mountPath: /data/temp

          restartPolicy: OnFailure

          volumes:
          - name: temp-dir
            emptyDir: {}
