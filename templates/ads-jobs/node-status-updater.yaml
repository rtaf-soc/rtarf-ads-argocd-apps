apiVersion: batch/v1
kind: CronJob
metadata:
  name: nodes-status-updater
spec:
  # kubectl create job --from=cronjob/nodes-status-updater nodes-status-updater-001 -n ads-prod
  suspend: false
  schedule: "*/5 * * * *" # Every 5 minutes
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          containers:
          - name: cron-script
            image: asia-southeast1-docker.pkg.dev/its-artifact-commons/rtarf/ads-jobs:{{ .Values.adsJob.imageTag }}
            imagePullPolicy: IfNotPresent
            command:
            - ruby
            args:
            - /scripts/nodes-status-update.rb
            env:
            #- name: REDIS_HOST
            #  value: redis-master

            #- name: REDIS_PORT
            #  value: "6379"

            #- name: REDIS_PASSWORD
            #  value: "anything-notuse"

            - name: PG_HOST
              value: "postgresql-ads"

            - name: PG_DB
              value: "ads"

            - name: PG_USER
              value: "postgres"

            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ads-postgres-secret
                  key: adminPasswordKey
                  optional: false

            volumeMounts:
            - name: temp-dir
              mountPath: /data/temp

          restartPolicy: OnFailure

          volumes:
          - name: temp-dir
            emptyDir: {}
