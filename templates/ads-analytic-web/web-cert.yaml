{{ if eq .Values.envAlias "prod" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ads-analytic-web-cert
spec:
  secretName: ads-analytic-web-cert
  dnsNames:
    - {{ .Values.domainWebAnalytic }}
  issuerRef:
    name: lets-encrypt-issuer-prod
    kind: ClusterIssuer
    group: cert-manager.io
{{- end -}}
